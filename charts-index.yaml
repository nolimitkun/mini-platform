apiVersion: mini-platform.dev/v1alpha1
kind: ChartInventory
metadata:
  name: mini-platform-charts
  description: Vendored Helm charts used by the Mini Platform deployment repo.
spec:
  generatedFrom: charts/*/Chart.yaml
  policy:
    vendored: true
    customizeIn: mini-platform-deployment
    updateMode: replace-chart-subtree
  charts:
    - path: charts/alloy
      name: alloy
      chartVersion: 1.11.1
      appVersion: v1.18.1
      category: observability
      upstream:
        home: https://grafana.com/oss/alloy/
        chartRepository: https://grafana.github.io/helm-charts
        source: https://github.com/grafana/alloy
    - path: charts/argo-cd
      name: argo-cd
      chartVersion: 9.5.15
      appVersion: v3.4.2
      category: gitops
      upstream:
        home: https://github.com/argoproj/argo-helm
        chartRepository: https://argoproj.github.io/argo-helm
        source: https://github.com/argoproj/argo-helm
    - path: charts/grafana
      name: grafana
      chartVersion: 12.4.0
      appVersion: 13.0.1-security-01
      category: observability
      upstream:
        home: https://grafana.com
        chartRepository: https://grafana.github.io/helm-charts
        source: https://github.com/grafana/helm-charts
    - path: charts/jupyterhub
      name: jupyterhub
      chartVersion: 4.3.5
      appVersion: 5.4.6
      category: notebooks
      upstream:
        home: https://z2jh.jupyter.org
        chartRepository: https://hub.jupyter.org/helm-chart/
        source: https://github.com/jupyterhub/zero-to-jupyterhub-k8s
    - path: charts/kagent
      name: kagent
      chartVersion: 0.9.12
      appVersion: null
      category: agentic-ai
      upstream:
        home: https://kagent.dev/
        chartRepository: oci://ghcr.io/kagent-dev/kagent/helm
        source: https://github.com/kagent-dev/kagent
    - path: charts/kagent-crds
      name: kagent-crds
      chartVersion: 0.9.12
      appVersion: null
      category: agentic-ai
      upstream:
