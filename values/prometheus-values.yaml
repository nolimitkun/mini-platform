extraScrapeConfigs: |
  - job_name: postgresql
    static_configs:
      - targets: ["postgresql-metrics:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-metrics:9121"]
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: litellm
    static_configs:
      - targets: ["litellm:4000"]
  - job_name: mlflow
    metrics_path: /metrics
    static_configs:
      - targets: ["mlflow-tracking:80"]
  - job_name: vllm-router
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm-router-service:80"]
  - job_name: trino
    metrics_path: /metrics
    static_configs:
      - targets: ["trino:5556"]
