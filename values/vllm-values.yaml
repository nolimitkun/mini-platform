servingEngineSpec:
  runtimeClassName: ""
  modelSpec:
    - name: opt125m
      repository: vllm/vllm-openai
      tag: latest
      modelURL: facebook/opt-125m
      replicaCount: 1
      requestCPU: 1
      requestMemory: 2Gi
      requestGPU: 1
  serviceMonitor:
    enabled: false

routerSpec:
  enableRouter: true
  serviceType: ClusterIP
  servicePort: 80
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
  routingLogic: session
  sessionKey: x-user-id
  serviceMonitor:
    enabled: false

