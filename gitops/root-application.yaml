apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nolimitkun/mini-platform.git
    targetRevision: main
    path: gitops/mini-platform
    helm:
      parameters:
        - name: repoURL
          value: https://github.com/nolimitkun/mini-platform.git
        - name: targetRevision
          value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
