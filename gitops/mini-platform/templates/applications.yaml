{{- $repoURL := required "Set repoURL to the Git repository containing the Mini Platform charts." .Values.repoURL -}}
{{- range $name, $app := .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-platform-{{ $name }}
  namespace: {{ $.Values.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
spec:
  project: mini-platform
  source:
    repoURL: {{ $repoURL | quote }}
    targetRevision: {{ $.Values.targetRevision | quote }}
    path: {{ $app.chartPath | quote }}
    helm:
      releaseName: {{ default $name $app.releaseName | quote }}
      valueFiles:
        - {{ printf "../../%s" $app.valuesFile | quote }}
  destination:
    server: {{ $.Values.destination.server }}
    namespace: {{ default $.Values.destination.namespace $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- with $app.ignoreDifferences }}
  ignoreDifferences:
{{ toYaml . | nindent 4 }}
{{- end }}
{{- end }}
