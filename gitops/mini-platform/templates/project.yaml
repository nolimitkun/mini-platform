{{- $repoURL := required "Set repoURL to the Git repository containing the Mini Platform charts." .Values.repoURL -}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mini-platform
  namespace: {{ .Values.argoNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Mini Platform applications managed by Argo CD.
  sourceRepos:
    - {{ $repoURL | quote }}
  destinations:
    - namespace: {{ .Values.destination.namespace }}
      server: {{ .Values.destination.server }}
    - namespace: {{ .Values.argoNamespace }}
      server: {{ .Values.destination.server }}
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
